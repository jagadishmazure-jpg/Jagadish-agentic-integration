[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentint"
version = "0.1.0"
description = "Enterprise integration patterns with agentic AI endpoints"
requires-python = ">=3.10"

[tool.hatch.build.targets.wheel]
packages = ["agentint"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "B"]
ignore = ["E741", "B905"]
